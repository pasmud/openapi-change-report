name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test]'
      - run: python -m ruff check .
      - run: python -m pytest -q
      - name: Exercise installed CLI on synthetic fixtures
        run: openapi-change-report examples/parcel-labels.before.yaml examples/parcel-labels.after.json --format json --fail-on never
